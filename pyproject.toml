[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "china-financial-services"
version = "2.2.0"
description = "Evidence-first China A-share research skills and plugin validation tools"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "akshare==1.18.94",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "python-pptx==1.0.2",
  "PyYAML==6.0.3",
  "tushare==1.4.29",
]

[tool.setuptools]
packages = []
