name: tushare-live-acceptance

on:
  workflow_dispatch:
    inputs:
      strict_optional:
        description: Fail if a separately granted endpoint such as yc_cb is unavailable
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tushare-live-acceptance
  cancel-in-progress: false

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify secret is configured without printing it
        run: python -c 'import os, sys; sys.exit(0 if os.environ.get("TUSHARE_TOKEN") else 2)'
      - name: Install pinned live-test dependencies
        run: python -m pip install --require-hashes -r requirements/live-acceptance-lock.txt
      - name: Live preflight
        run: python scripts/preflight.py --mode tushare-live
      - name: Run router and acceptance unit tests
        run: python -m unittest -v tests.test_china_market_data tests.test_tushare_live_acceptance
      - name: Run sanitized read-only acceptance
        shell: bash
        run: |
          args=(--output "$RUNNER_TEMP/tushare-live-acceptance.json")
          if [[ "${{ inputs.strict_optional }}" == "true" ]]; then
            args+=(--strict-optional)
          fi
          python scripts/tushare_live_acceptance.py "${args[@]}"
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tushare-live-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/tushare-live-acceptance.json
          if-no-files-found: warn
          retention-days: 30
