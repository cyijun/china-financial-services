name: repository-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hash-locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements/runtime-lock.txt
      - name: Runtime preflight
        run: python scripts/preflight.py --mode runtime
      - name: Verify generated bundles have no drift
        run: python scripts/sync-agent-skills.py --check
      - name: Plugin, skill, link, dependency and mirror checks
        run: python scripts/check.py
      - name: Offline data-contract and ledger tests
        run: python -m unittest discover -v tests

  host-loaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned host CLIs on the disposable runner
        run: npm install --global @openai/codex@0.149.0 @anthropic-ai/claude-code@2.1.212 @moonshot-ai/kimi-code@0.33.0
      - name: Record host versions
        run: |
          codex --version
          claude --version
          kimi --version
      - name: Claude strict manifest validation
        run: |
          claude plugin validate --strict .
          for plugin in plugins/*; do
            claude plugin validate --strict "$plugin"
          done
      - name: Codex marketplace discovery and installation smoke
        run: |
          expected=(china-research-methodology financial-analysis equity-research china-market-researcher china-model-builder)
          codex plugin marketplace add . --json
          codex plugin list --available --json | python scripts/assert_plugin_inventory.py "${expected[@]}"
          for plugin in "${expected[@]}"; do
            codex plugin add "$plugin@china-financial-services" --json
          done
          codex plugin list --json | python scripts/assert_plugin_inventory.py "${expected[@]}"
      - name: Claude local marketplace installation smoke
        run: |
          expected=(china-research-methodology financial-analysis equity-research china-market-researcher china-model-builder)
          claude plugin marketplace add ./ --scope local
          for plugin in "${expected[@]}"; do
            claude plugin install "$plugin@china-financial-services" --scope local
          done
          claude plugin list --json | python scripts/assert_plugin_inventory.py "${expected[@]}"
      - name: Kimi local-marketplace and Skill-directory parser smoke
        run: |
          python -m json.tool kimi-marketplace.json >/dev/null
          for skills in plugins/*/skills; do
            kimi --skills-dir "$skills" --help >/dev/null
          done
          kimi --skills-dir plugins/china-research-methodology/skills \
            --skills-dir plugins/financial-analysis/skills --help >/dev/null
