name: repository-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
      - name: Plugin, skill, link, dependency and mirror checks
        run: python scripts/check.py
      - name: Offline data-contract and ledger tests
        run: python -m unittest discover -v tests
      - name: Managed-agent dry runs
        run: bash scripts/test-cookbooks.sh
